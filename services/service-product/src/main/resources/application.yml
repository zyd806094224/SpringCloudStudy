server:
  port: 9000
spring:
  application:
    name: service-product
  profiles:
    active: dev

# rocketmq
rocketmq:
  name-server: 127.0.0.1:9876

# 钉钉告警配置（占位配置，替换为真实 webhook/secret 后将 enabled 改为 true）
alarm:
  ding-talk:
    enabled: false
    webhook: https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN
    secret: YOUR_SECRET
    keyword: "[库存服务]"


